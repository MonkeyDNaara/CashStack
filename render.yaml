# Render Blueprint (infrastructure as code) for the CashStack live demo.
# Workspace "Course Workspace", region Frankfurt, free plan. Database: Neon Postgres (not managed here).
# Values marked "sync: false" are set in the Render dashboard, never in this file:
#   ConnectionStrings__CashStack  Npgsql key-value format (secret, contains the password)
#   Cors__AllowedOrigins__0       URL of the static site, e.g. https://cashstack-web.onrender.com
#   VITE_API_URL                  URL of the API, read at build time by Vite

services:
  # REST API: Render has no native .NET runtime, so it runs the Dockerfile
  - type: web
    name: cashstack-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Liveness only (no database query), see HealthCheckExtensions
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Only back-end changes rebuild the image
    buildFilter:
      paths:
        - src/**
        - Dockerfile
        - .dockerignore
    envVars:
      - key: Storage__Provider
        value: Postgres
      - key: ConnectionStrings__CashStack
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      # Fills an empty demo at startup (DemoDataSeeder)
      - key: Demo__SeedIfEmpty
        value: "true"
      # "Local day" of a transaction: the visitors are in Germany, the container runs in UTC
      - key: TZ
        value: Europe/Berlin

  # React front end: static files on Render's CDN
  - type: web
    name: cashstack-web
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    # Client-side routing: every path serves index.html (rewrite, not redirect).
    # Existing files like robots.txt or /assets/* are served as they are.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      # Demo footer and the "server may be waking up" wording
      - key: VITE_DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "26.12.0"
